name: Build Android (apk)

# 내 키스토어로 서명한 .apk 를 Release 에 올린다. PC 에서 만든 빌드와 서명이 같아서 지우지 않고 덮어 설치된다.
# 필요한 시크릿: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (iOS 와 같음)
#              ANDROID_KEYSTORE_BASE64 (kkuk7364.keystore 를 base64 로), ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_PASS (별칭 yangkey 비밀번호)
on:
  push:
    branches: [main]
    # 앱에 들어가는 것이 바뀔 때만 빌드한다
    paths:
      - 'Project_SE/Assets/**'
      - 'Project_SE/Packages/**'
      - 'Project_SE/ProjectSettings/**'
      - 'content/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 한 번에 하나씩 (진행 중인 실행은 끝까지 돈다)
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          MISSING=""
          for n in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_PASS; do
            [ -n "${!n}" ] || MISSING="$MISSING $n"
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=시크릿 없음::레포 Settings → Secrets and variables → Actions 에 등록하세요:$MISSING"
            exit 1
          fi
      # Android 모듈이 든 Unity 도커 이미지 + Library + Gradle 로 디스크·메모리가 빠듯하다 (Unity exit 137 방지)
      # (러너의 Android SDK 는 지워도 된다. 도커 이미지 안의 SDK 를 쓴다)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile > /dev/null
          sudo swapon /mnt/ci-swapfile
          free -h
      # 폰트(잘난체)·이미지 등은 Git LFS 에 있다. lfs 를 안 받으면 포인터 파일이 빌드에 들어가 한글이 깨진다.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check LFS files
        run: |
          if grep -rlI --include='*.ttf' --include='*.otf' --include='*.png' '^version https://git-lfs' Project_SE/Assets | head -5 | grep .; then
            echo "::error::LFS 파일이 포인터로 남아 있습니다"; exit 1
          fi
      # ProjectSettings 가 가리키는 자리({inproject}: Keystore/kkuk7364.keystore)에 키스토어를 만든다 (레포에는 없음, .gitignore)
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS=$(grep -m1 'AndroidKeystoreName:' Project_SE/ProjectSettings/ProjectSettings.asset | sed -E "s/.*\{inproject\}: *//; s/'.*//")
          test -n "$KS" || { echo "::error::ProjectSettings 에 AndroidKeystoreName 이 없습니다"; exit 1; }
          mkdir -p "Project_SE/$(dirname "$KS")"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "Project_SE/$KS"
          ls -l "Project_SE/$KS"
      - id: v
        run: |
          V=$(grep -m1 'bundleVersion:' Project_SE/ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app version $V, build ${{ github.run_number }}"
      - uses: actions/cache@v4
        with:
          path: Project_SE/Library
          key: Library-Android-${{ hashFiles('Project_SE/Packages/manifest.json', 'Project_SE/Packages/packages-lock.json', 'Project_SE/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Project_SE
          targetPlatform: Android
          # 에디터 버전 고정 (ProjectVersion.txt 와 같게). 6000.3.29f1 은 game-ci 이미지 v4 에만 있다
          customImage: unityci/editor:ubuntu-6000.3.29f1-android-4.0.0
          buildMethod: EnglishApp.EditorTools.CiBuild.BuildAndroid
          versioning: None   # 버전은 ProjectSettings 의 bundleVersion 그대로
          # 비밀번호는 Unity 에 -androidKeystorePass / -androidKeyaliasPass 로 넘어간다 (CiBuild.BuildAndroid 가 읽음)
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -appBuild ${{ github.run_number }}
      - name: Find apk
        run: |
          APK=$(find build -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::apk 가 없습니다"; find build -maxdepth 3; exit 1; }
          ls -lh "$APK"
          cp "$APK" app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app.apk
          retention-days: 3   # 오래 둘 것은 Release 에 있다

  # main 에서만 Release 에 apk 를 올린다 (태그 android-v<버전>-b<빌드번호>)
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - run: mv app.apk "EnglishSpeaking-Android-v$VERSION-b$BUILD.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}-b${{ env.BUILD }}
          target_commitish: ${{ github.sha }}
          name: Android v${{ env.VERSION }} (build ${{ env.BUILD }})
          prerelease: true   # 기기 설치 테스트용 (스토어 배포는 .aab)
          body: |
            내 키스토어로 서명한 Android 빌드 (기기 설치 테스트용). 폰에서 받아 설치하거나 `adb install -r` 로 덮어 설치.
            커밋: ${{ github.sha }}
          files: EnglishSpeaking-Android-v${{ env.VERSION }}-b${{ env.BUILD }}.apk
